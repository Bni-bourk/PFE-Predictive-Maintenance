<svg width="1700" height="1420" viewBox="0 0 1700 1420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5C7185"/>
    </marker>
  </defs>
  <style>
    .t  { font-family: Calibri, Arial, sans-serif; }
    .title { font-size: 30px; font-weight: bold; fill: #1F3864; }
    .box-title { font-size: 24px; font-weight: bold; fill: #1F3864; }
    .box-title-w { font-size: 24px; font-weight: bold; fill: #FFFFFF; }
    .small { font-size: 18px; fill: #444444; }
    .small-w { font-size: 18px; fill: #E8EEF5; }
    .tiny { font-size: 16px; fill: #5C7185; }
    .lbl { font-size: 18px; font-weight: bold; fill: #5C7185; }
    .mono { font-family: 'Courier New', monospace; font-size: 16px; fill: #444; }
  </style>

  <rect x="0" y="0" width="1700" height="1420" fill="#FFFFFF"/>

  <!-- ============ EXTERNAL: GATEWAY ============ -->
  <rect x="550" y="30" width="600" height="90" rx="10" fill="#1F3864"/>
  <text class="t box-title-w" x="850" y="68" text-anchor="middle">Passerelle IoT (ESP32)</text>
  <text class="t small-w" x="850" y="98" text-anchor="middle">Serveur Modbus TCP — Port 503 (flux IT dédié)</text>

  <line x1="850" y1="120" x2="850" y2="175" stroke="#5C7185" stroke-width="2.5" marker-end="url(#arr)"/>
  <text class="t tiny" x="870" y="152">Modbus TCP (lecture des registres)</text>

  <!-- ============ BACKEND ============ -->
  <rect x="400" y="180" width="900" height="110" rx="10" fill="#EEF2F8" stroke="#1F3864" stroke-width="2"/>
  <text class="t box-title" x="850" y="220" text-anchor="middle">Backend Node.js</text>
  <text class="t small" x="850" y="250" text-anchor="middle">Client Modbus TCP (polling passerelle) • Évaluation des règles d'alarme • Historisation</text>
  <text class="t small" x="850" y="276" text-anchor="middle">Journalisation des événements (backend.log)</text>

  <!-- Two communication channels -->
  <line x1="640" y1="290" x2="640" y2="360" stroke="#1B8F88" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="430" y="305" width="185" height="44" rx="8" fill="#1B8F88"/>
  <text class="t small-w" x="522" y="333" text-anchor="middle" font-weight="bold">Socket.io (temps réel)</text>
  <text class="t tiny" x="660" y="318">configLoaded • gatewayStatus</text>
  <text class="t tiny" x="660" y="338">sensorData • alarmUpdate</text>

  <line x1="1060" y1="290" x2="1060" y2="360" stroke="#C77F1A" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="1085" y="305" width="185" height="44" rx="8" fill="#C77F1A"/>
  <text class="t small-w" x="1177" y="333" text-anchor="middle" font-weight="bold">API REST (HTTP)</text>
  <text class="t tiny" x="880" y="318">historique • journaux</text>
  <text class="t tiny" x="880" y="338">configuration (CRUD)</text>

  <!-- ============ FRONTEND CONTAINER ============ -->
  <rect x="60" y="365" width="1580" height="1010" rx="14" fill="#FFFFFF" stroke="#1F3864" stroke-width="3"/>
  <text class="t title" x="850" y="410" text-anchor="middle">Frontend — Application React SPA (App.jsx)</text>

  <!-- Shell -->
  <rect x="110" y="440" width="1480" height="90" rx="10" fill="#1F3864"/>
  <text class="t box-title-w" x="850" y="477" text-anchor="middle">Conteneur applicatif (Shell)</text>
  <text class="t small-w" x="850" y="507" text-anchor="middle">Barre latérale de navigation • Compteurs globaux : passerelles actives, nœuds, nœuds en défaut • Rendu de l'onglet actif</text>

  <line x1="850" y1="530" x2="850" y2="565" stroke="#5C7185" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- State layer -->
  <rect x="110" y="570" width="1480" height="100" rx="10" fill="#EEF2F8" stroke="#2E5395" stroke-width="2"/>
  <text class="t box-title" x="850" y="605" text-anchor="middle">Couche de données et d'état (React Local State)</text>
  <text class="t mono" x="850" y="635" text-anchor="middle">gateways • gwStatus • sensorData • history (mémoire glissante 200 points) • alarms • alarmRules • historianGroups</text>

  <line x1="850" y1="670" x2="850" y2="705" stroke="#5C7185" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- ============ 5 TABS ============ -->
  <text class="t lbl" x="850" y="732" text-anchor="middle">LES CINQ MODULES / ONGLETS PRINCIPAUX</text>

  <!-- Tab 1 -->
  <rect x="110" y="750" width="280" height="330" rx="10" fill="#FFFFFF" stroke="#1B8F88" stroke-width="2.5"/>
  <rect x="110" y="750" width="280" height="52" rx="10" fill="#1B8F88"/>
  <text class="t small-w" x="250" y="783" text-anchor="middle" font-weight="bold" font-size="21">1. Overview</text>
  <text class="t small" x="130" y="835">• Vue réseau : grille des</text>
  <text class="t small" x="142" y="859">passerelles + statut TCP</text>
  <text class="t small" x="130" y="890">• Tables des nœuds enfants</text>
  <text class="t small" x="130" y="921">• Drill-down par nœud :</text>
  <text class="t small" x="142" y="945">cartes KPI (Vib X/Y/Z,</text>
  <text class="t small" x="142" y="969">RSSI, statut machine)</text>
  <text class="t small" x="130" y="1000">• Graphique temps réel</text>
  <text class="t small" x="142" y="1024">Recharts avec zoom</text>
  <text class="t small" x="142" y="1048">(brush)</text>

  <!-- Tab 2 -->
  <rect x="410" y="750" width="280" height="330" rx="10" fill="#FFFFFF" stroke="#2E5395" stroke-width="2.5"/>
  <rect x="410" y="750" width="280" height="52" rx="10" fill="#2E5395"/>
  <text class="t small-w" x="550" y="783" text-anchor="middle" font-weight="bold" font-size="21">2. Historian</text>
  <text class="t small" x="430" y="835">• Courbes historiques par</text>
  <text class="t small" x="442" y="859">nœud ou par groupe</text>
  <text class="t small" x="442" y="883">(historianGroups)</text>
  <text class="t small" x="430" y="914">• Filtrage par plage de</text>
  <text class="t small" x="442" y="938">dates (datetime-local)</text>
  <text class="t small" x="430" y="969">• Export CSV direct</text>

  <!-- Tab 3 -->
  <rect x="710" y="750" width="280" height="330" rx="10" fill="#FFFFFF" stroke="#C0392B" stroke-width="2.5"/>
  <rect x="710" y="750" width="280" height="52" rx="10" fill="#C0392B"/>
  <text class="t small-w" x="850" y="783" text-anchor="middle" font-weight="bold" font-size="21">3. Alarm Manager</text>
  <text class="t small" x="730" y="835">• Liste des règles</text>
  <text class="t small" x="742" y="859">personnalisées</text>
  <text class="t small" x="742" y="883">(ex. : vibX &gt; 1,5)</text>
  <text class="t small" x="730" y="914">• Alarmes actives et</text>
  <text class="t small" x="742" y="938">niveaux de sévérité</text>
  <text class="t small" x="742" y="962">(warning / critical)</text>
  <text class="t small" x="730" y="993">• Acquittement opérateur</text>
  <text class="t small" x="742" y="1017">(Ack) et journal</text>

  <!-- Tab 4 -->
  <rect x="1010" y="750" width="280" height="330" rx="10" fill="#FFFFFF" stroke="#7D3C98" stroke-width="2.5"/>
  <rect x="1010" y="750" width="280" height="52" rx="10" fill="#7D3C98"/>
  <text class="t small-w" x="1150" y="783" text-anchor="middle" font-weight="bold" font-size="21">4. Configuration</text>
  <text class="t small" x="1030" y="835">• CRUD des passerelles</text>
  <text class="t small" x="1042" y="859">et des nœuds capteurs</text>
  <text class="t small" x="1030" y="890">• Paramétrage des</text>
  <text class="t small" x="1042" y="914">adresses de registres :</text>
  <text class="t mono" x="1042" y="940">statusReg, vibXReg,</text>
  <text class="t mono" x="1042" y="964">vibYReg, vibZReg,</text>
  <text class="t mono" x="1042" y="988">rssiReg</text>
  <text class="t small" x="1030" y="1019">• Modales d'ajout /</text>
  <text class="t small" x="1042" y="1043">édition</text>

  <!-- Tab 5 -->
  <rect x="1310" y="750" width="280" height="330" rx="10" fill="#FFFFFF" stroke="#C77F1A" stroke-width="2.5"/>
  <rect x="1310" y="750" width="280" height="52" rx="10" fill="#C77F1A"/>
  <text class="t small-w" x="1450" y="783" text-anchor="middle" font-weight="bold" font-size="21">5. Communications</text>
  <text class="t small" x="1330" y="835">• Points de connexion,</text>
  <text class="t small" x="1342" y="859">durées de polling et</text>
  <text class="t small" x="1342" y="883">erreurs TCP par</text>
  <text class="t small" x="1342" y="907">passerelle</text>
  <text class="t small" x="1330" y="938">• Console de journaux du</text>
  <text class="t small" x="1342" y="962">backend en temps réel</text>
  <text class="t small" x="1342" y="986">(backend.log)</text>

  <!-- ============ 6th module: sticky banner ============ -->
  <rect x="110" y="1110" width="1480" height="95" rx="10" fill="#C0392B"/>
  <text class="t box-title-w" x="850" y="1148" text-anchor="middle">6. Bandeau d'alarmes global permanent (Sticky Bottom Banner)</text>
  <text class="t small-w" x="850" y="1180" text-anchor="middle">Superposé en bas de l'écran quel que soit l'onglet actif • Évalue en continu les alarmes non acquittées • Animation clignotante (pulse) rouge/jaune • Acquittement direct depuis le bandeau</text>

  <!-- ============ UI libs strip ============ -->
  <rect x="110" y="1235" width="1480" height="100" rx="10" fill="#EEF2F8" stroke="#5C7185" stroke-width="1.5"/>
  <text class="t box-title" x="850" y="1272" text-anchor="middle">Bibliothèques UI partagées</text>
  <text class="t small" x="850" y="1305" text-anchor="middle">Recharts (graphiques temps réel et historiques) • Lucide Icons (iconographie de navigation) • Modales HTML personnalisées (ajout / édition)</text>

  <!-- caption zone note -->
  <text class="t tiny" x="850" y="1400" text-anchor="middle">Architecture logicielle du SCADA vibratoire — React SPA + backend Node.js, connectés à la passerelle via Modbus TCP (port 503)</text>
</svg>
